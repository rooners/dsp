[Server]

## Password required to connect to the server. Leave empty for no password.
# Setting type: String
# Default value: 
ServerPassword = 

## Automatically pause the game when there are no connected players.
# Setting type: Boolean
# Default value: true
AutoPauseEnabled = true

# Setting type: UInt16
# Default value: 8469
HostPort = 8469

## Allows authenticated clients to access remote server commands.
# Setting type: Boolean
# Default value: false
RemoteAccessEnabled = false

## Sets password used for clients to authenticate for remote commands (/server login <password>).
# Setting type: String
# Default value: 
RemoteAccessPassword = 

